<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Callback · Honk if You're Skylar</title>
  <link rel="stylesheet" href="../../../assets/style.css">
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search);
      var code = q.get("code");
      var err = q.get("error");
      var state = q.get("state") || "";
      var target = "";
      if (code) {
        target = "honkifyoureskylar://auth?tesla_code=" + encodeURIComponent(code) + "&state=" + encodeURIComponent(state);
      } else if (err) {
        target = "honkifyoureskylar://auth?error=" + encodeURIComponent(err);
      }
      if (!target) return;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <main>
    <p class="badge">callback</p>
    <h1>Alternate sign-in door.</h1>
    <div class="bubble">
      <p>The registered redirect is <a href="/path">/path</a>. This address is the same handshake if you ever point Tesla here instead.</p>
    </div>
  </main>
</body>
</html>
